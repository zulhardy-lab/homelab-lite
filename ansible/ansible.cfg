[defaults]
inventory = inventory/hosts.ini
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True

[privilege_escalation]
# Ubuntu 26.04 uses sudo-rs as "sudo". Ansible currently times out waiting for its
# password prompt (Launchpad bug 2122414, ansible/ansible#85837). Use classic sudo
# (sudo.ws, present on every VM) for Ansible only. Remove once a fixed ansible-core ships.
become_exe = sudo.ws
