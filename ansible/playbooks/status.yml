---
# The status collector on app01: every second it writes status.json (app01, Docker, containers, last deploy)
# for the dashboard. It runs as the deploy user, so the dashboard container never needs the Docker socket.
# Run after deploy-access.yml: ansible-playbook playbooks/status.yml -K
#
# Earlier versions ran the collector from a 30-second timer (homelab-lite-status.timer). This playbook stops and
# disables that timer; its unit file is left in place, and does nothing while disabled.

- name: Status collector on app01
  hosts: app
  become: true
  tasks:
    - name: Install the collector script
      ansible.builtin.copy:
        src: status-collector.py
        dest: /usr/local/bin/status-collector
        owner: root
        group: root
        mode: "0755"
      notify: Restart the collector

    - name: Look for the old 30-second timer
      ansible.builtin.stat:
        path: /etc/systemd/system/homelab-lite-status.timer
      register: old_timer

    - name: Stop and disable the old 30-second timer (the service below now loops by itself)
      ansible.builtin.systemd_service:
        name: homelab-lite-status.timer
        state: stopped
        enabled: false
      when: old_timer.stat.exists

    - name: Collector service (runs all the time, refreshes status.json every second)
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-lite-status.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=homelab-lite: write status.json for the dashboard, every second
          After=docker.service

          [Service]
          Type=simple
          User={{ deploy_user }}
          Environment=STATUS_DIR={{ status_dir }}
          Environment=APP01_IP={{ app01_ip }}
          Environment=INTERVAL=1
          ExecStart=/usr/local/bin/status-collector
          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart the collector

    - name: Apply systemd changes now
      ansible.builtin.meta: flush_handlers

    - name: Start the collector now and after every reboot
      ansible.builtin.systemd_service:
        name: homelab-lite-status.service
        state: started
        enabled: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart the collector
      ansible.builtin.systemd_service:
        name: homelab-lite-status.service
        state: restarted
