# How app01 runs the lab. scripts/deploy.sh copies this folder to app01 and writes .env next to it:
#   IMAGE_PREFIX  ghcr.io/<owner>/<repo>-   (your images on GitHub's container registry)
#   IMAGE_TAG     the commit that was deployed
#   APP01_IP      app01's address (for the <app>.<ip>.nip.io names)
#
# Only Caddy publishes a port (80). The apps are reached through it, by name.
# The label homelab-lite.link=<name> puts a link to http://<name>.<app01-ip>.nip.io on the dashboard.
# Every app container: read-only filesystem, no Linux capabilities, no privilege escalation.

name: homelab-lite

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  caddy:
    # Caddy 2.11.4, pinned by digest (read from Docker Hub's API on 2026-11-27). 2.11.2 was blocked by the Trivy gate:
    # fixed vulnerabilities in 2.11.3 / 2.11.4. The PR checks pull and scan this exact image before it reaches app01.
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: caddy
    <<: *hardened
    cap_add: [NET_BIND_SERVICE] # to listen on port 80
    ports: ["80:80"]
    environment:
      APP01_IP: ${APP01_IP:?APP01_IP not set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs: [/data, /config]

  dashboard:
    image: ${IMAGE_PREFIX:?}dashboard:${IMAGE_TAG:?}
    container_name: dashboard
    <<: *hardened
    volumes:
      - /srv/homelab-lite/status:/status:ro # status.json + ci01.json; NO Docker socket

  example-data:
    image: ${IMAGE_PREFIX:?}example-data:${IMAGE_TAG:?}
    container_name: example-data
    <<: *hardened
    labels:
      homelab-lite.link: example-data

  news:
    image: ${IMAGE_PREFIX:?}news:${IMAGE_TAG:?}
    container_name: news
    <<: *hardened
    environment:
      # The feed to show. Choices and their terms: docs/SETUP.md, "The news app".
      NEWS_FEED_URL: https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6311
    labels:
      homelab-lite.link: news
